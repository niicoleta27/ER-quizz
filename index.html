function getQuestions(topic) {
  const q = topic === 'all' ? [...ALL_QUESTIONS] : ALL_QUESTIONS.filter(q => q.topic === topic);
  // shuffle
  for (let i = q.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [q[i], q[j]] = [q[j], q[i]];
  }
  return q;
}

    btn.textContent = t.label;
    btn.onclick = () => selectTopic(t.id);
    btn.dataset.id = t.id;
    container.appendChild(btn);
  });
}

function selectTopic(id) {
  currentTopic = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
  startQuiz();
}

function startQuiz() {
  questions = getQuestions(currentTopic);
  currentIdx = 0;
  score = 0;
  document.getElementById('score-panel').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[currentIdx];
  document.getElementById('q-topic').textContent = q.topicLabel;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-explanation').className = 'explanation';
  document.getElementById('q-explanation').innerHTML = q.explanation;

  const total = questions.length;
  const done = currentIdx;
  document.getElementById('prog-text').textContent = `Întrebarea ${currentIdx + 1} din ${total}`;
  document.getElementById('prog-fill').style.width = `${(done / total) * 100}%`;

  const nextBtn = document.getElementById('btn-next');
  nextBtn.disabled = true;
  nextBtn.textContent = currentIdx < questions.length - 1 ? 'Următoarea →' : 'Vezi rezultatul';

  const optContainer = document.getElementById('q-options');
  optContainer.innerHTML = '';
  // shuffle options
  const indices = [0, 1, 2, 3];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  indices.forEach(i => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = q.opts[i];
    btn.dataset.idx = i;
    btn.onclick = () => selectAnswer(i, q.correct);
    optContainer.appendChild(btn);
  });
}

function selectAnswer(chosen, correct) {
  if (answered) return;
  answered = true;

  if (chosen === correct) score++;

  document.querySelectorAll('.option').forEach(btn => {
    btn.disabled = true;
    const idx = parseInt(btn.dataset.idx);
    if (idx === correct) btn.classList.add('correct');
    else if (idx === chosen && chosen !== correct) btn.classList.add('wrong');
  });

  document.getElementById('q-explanation').classList.add('show');
  document.getElementById('btn-next').disabled = false;
}

document.getElementById('btn-next').onclick = () => {
  if (!answered) return;
  currentIdx++;
  if (currentIdx >= questions.length) {
    showScore();
  } else {
    showQuestion();
  }
};

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  const panel = document.getElementById('score-panel');
  panel.classList.add('show');
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('score-num').textContent = `${score}/${questions.length}`;

  let msg, sub;
  if (pct >= 80) {
    msg = '🎉 Excelent! Ești pregătită!';
    sub = 'Cunoști materialul foarte bine. Succes la examen!';
  } else if (pct >= 60) {
    msg = '👍 Bine, dar mai repetă!';
    sub = 'Reverezi explicațiile de la întrebările greșite și ești gata.';
  } else {
    msg = '📚 Mai ai de lucru!';
    sub = 'Recitește rezumatul și încearcă din nou. Poți!';
  }
  document.getElementById('score-msg').textContent = msg;
  document.getElementById('score-sub').textContent = sub;
}

function restart() {
  startQuiz();
}

buildTabs();
startQuiz();
</script>

</html>
